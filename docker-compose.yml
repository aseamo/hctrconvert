services:
  hctrconvert:
    build: .
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=HctrConvert
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE_MB=500
    volumes:
      - ./backend:/app            # hot-reload in development
      - ./frontend:/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
